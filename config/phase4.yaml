# config/phase4.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Phase 4 — Multi-format Ingestion · Agentic Decision-Making · MCP Client & Server
# Extends phase3.yaml — inherits all retrieval / embedding / store settings.
# ─────────────────────────────────────────────────────────────────────────────

version: "4.0.0"

chunking:
  min_tokens: 500
  max_tokens: 800
  overlap_tokens: 100
  tokenizer: "cl100k_base"

embedding:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1536
  batch_size: 64

vector_store:
  backend: "chroma"
  chroma:
    persist_directory: "./chroma_db"
    collection_name: "rag_phase4"
  weaviate:
    url: "http://localhost:8080"
    class_name: "RagChunk"

retrieval:
  top_k: 5
  score_threshold: 0.75
  include_metadata: true
  hybrid:
    enabled: true
    vector_weight: 0.6
    bm25_weight: 0.4
    candidate_multiplier: 4
  reranker:
    enabled: true
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k_after_rerank: 5

citation_enforcement:
  enabled: true
  min_citations_required: 1
  citation_pattern: "\\[([a-f0-9]{8}:\\d+)\\]"
  on_violation: "retry"
  max_retries: 2

ingestion:
  parsers:
    enabled_formats: ["txt", "md", "pdf", "docx", "tex"]
    pdf:
      ocr_fallback: false
    latex:
      keep_math: false

agent:
  enabled: true
  strategy: "auto"                 # auto | rag_only | rag_then_fallback
  max_tool_iterations: 4
  confidence_threshold: 0.75

mcp:
  servers:
    - name: "web_search"
      enabled: true
      transport: "stdio"
      command: "npx"
      args: ["-y", "tavily-mcp"]
      env:
        TAVILY_API_KEY: "${TAVILY_API_KEY}"
      tool_allowlist: ["search"]

  server:
    transport: "stdio"
    http_port: 8765
    ingest_allowlist_root: "./ingest_data"

evaluation:
  dataset_path: "eval/dataset.jsonl"
  results_path: "eval/results.jsonl"
  report_path: "eval/report.json"
  thresholds:
    faithfulness: 0.75
    answer_relevance: 0.70
    context_recall: 0.65
    citation_coverage: 0.80
  scorer:
    model: "gpt-4o-mini"
    batch_size: 10
    max_workers: 4
  ci:
    fail_on_threshold_breach: true
    min_dataset_size: 20
    sample_size: null

prompts:
  rag_system: |
    You are a precise research assistant. Answer the user's question using ONLY
    the provided context chunks.

    CITATION RULES (strictly enforced):
    1. Every factual claim MUST include an inline citation: [doc_id:chunk_index]
    2. Use the exact citation IDs shown in the context headers — do not invent them.
    3. If the context is insufficient, respond: "I don't have enough information."
    4. Never add knowledge beyond what the context contains.

  rag_user: |
    Context chunks:
    {context}

    Question: {question}

    Answer (every claim must be cited with [doc_id:chunk_index]):

  rag_retry: |
    Your previous answer was missing required inline citations [doc_id:chunk_index].
    Rewrite with EVERY factual claim cited. Use ONLY IDs from the context headers.

    Original answer:
    {previous_answer}

    Context chunks:
    {context}

    Corrected answer (with citations):

  agent_system: |
    You are a research assistant with two kinds of tools: local document search
    over the user's own ingested corpus, and external tools reached over MCP (e.g. web search).
    Prefer local search first — it's private and already citation-checked.
    Use an external tool when local search comes back empty, low-confidence, or the question
    needs current information the corpus can't have.
    You may use both and combine them.
    Cite local claims as [doc_id:chunk_index] and external claims as [web:n] with the source URL listed.
    If nothing supports a claim, say you don't know rather than guessing.

  faithfulness_judge: |
    You are an impartial evaluation judge. Your task is to assess whether an
    AI-generated answer is faithful to the provided context.

    Context:
    {context}

    Answer:
    {answer}

  answer_relevance_judge: |
    Question: {question}
    Answer: {answer}

  context_recall_judge: |
    GT: {ground_truth}
    Context: {context}
